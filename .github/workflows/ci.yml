name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ---------------------------------------------------------------------------
  # Main CI — typecheck, lint, build, test (all packages via turbo)
  # ---------------------------------------------------------------------------
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test

  # ---------------------------------------------------------------------------
  # node-pty native-build matrix — validates that node-pty 1.1.0 prebuilts
  # load and spawn a PTY on every supported platform without requiring
  # VS Build Tools / Xcode CLT / build-essential at install time.
  # ---------------------------------------------------------------------------
  pty-native:
    name: node-pty / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Install dependencies.  node-pty 1.1.0 ships prebuilts for Node 20 on
      # all three platforms so no native compiler is needed.
      - run: pnpm install --frozen-lockfile

      # Build shared first (cli depends on it via turbo pipeline).
      - run: pnpm --filter @mobily/shared build

      # Run only the PTY integration tests in the cli package.
      - run: pnpm --filter mobily exec vitest run tests/pty.test.ts
