name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ---------------------------------------------------------------------------
  # Main CI — typecheck, lint, build, test (all packages via turbo)
  # ---------------------------------------------------------------------------
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm --filter mobily-android exec playwright install --with-deps chromium
      - run: pnpm test

  # ---------------------------------------------------------------------------
  # node-pty native-build matrix — validates that node-pty 1.1.0 prebuilts
  # load and spawn a PTY on supported hosts (Linux / macOS; WSL shares the
  # Linux path) without requiring Xcode CLT / build-essential at install time.
  # Native Windows / PowerShell is deferred.
  # ---------------------------------------------------------------------------
  pty-native:
    name: node-pty / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Install dependencies.  node-pty 1.1.0 ships prebuilts for Node 20 on
      # Linux and macOS so no native compiler is needed.
      - run: pnpm install --frozen-lockfile

      # node-pty 1.1.0 prebuilt tarballs store pty.node and spawn-helper
      # without the execute bit set.  The spawn-helper must be executable or
      # posix_spawnp fails immediately at runtime.
      # pnpm stores node-pty under node_modules/.pnpm/…/node_modules/node-pty/
      # so we locate prebuilds/ with find rather than using a hardcoded path.
      - name: Fix node-pty prebuilt permissions
        run: |
          find node_modules -path "*/node-pty/prebuilds/*" -type f \
            \( -name "spawn-helper" -o -name "*.node" \) \
            -exec chmod +x {} \;

      # Build shared first (cli depends on it via turbo pipeline).
      - run: pnpm --filter @mobily/shared build

      # Run only the PTY integration tests in the cli package.
      - run: pnpm --filter mobily exec vitest run tests/pty.test.ts
