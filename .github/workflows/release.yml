name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.1.0). Leave empty to use package.json version.'
        required: false
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm --filter @mobily/shared build && pnpm --filter mobily build

      - name: Verify package tarball
        working-directory: cli
        run: |
          npm pack --dry-run
          node -e "
            const pkg = require('./package.json');
            const deps = pkg.dependencies || {};
            if (Object.values(deps).some((v) => String(v).includes('workspace:'))) {
              console.error('Published dependencies must not use workspace:');
              process.exit(1);
            }
            if (deps['@mobily/shared']) {
              console.error('@mobily/shared must be bundled, not a runtime dependency');
              process.exit(1);
            }
            console.log('package.json publish surface ok:', pkg.name + '@' + pkg.version);
          "

      - name: Publish to npm
        working-directory: cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            if [ "${{ github.ref_type }}" = "tag" ]; then
              TAG="${{ github.ref_name }}"
            else
              TAG="v$(node -p "require('./cli/package.json').version")"
            fi
          fi
          NOTES="Release ${TAG}

          Install:

          \`\`\`bash
          npx mobily@latest --tunnel local
          \`\`\`

          See [CHANGELOG.md](https://github.com/kirank55/mobily/blob/main/CHANGELOG.md)."
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" --title "$TAG" --notes "$NOTES"
          fi
