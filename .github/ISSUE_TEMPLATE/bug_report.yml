name: Bug report
description: Something is broken or unexpected
title: '[bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For security issues, use [SECURITY.md](https://github.com/kirank55/mobily/blob/main/SECURITY.md) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Commands, tunnel mode, Android build, and expected vs actual.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versions
      description: e.g. mobily CLI version, Android build, OS
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste relevant CLI output (`--verbose` if useful). Redact secrets.
    validations:
      required: false
