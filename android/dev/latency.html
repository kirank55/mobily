<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mobily — latency dev harness</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: #0d1117; color: #e6e6e6;
      font-family: 'JetBrains Mono', 'Cascadia Code', monospace;
      height: 100%;
    }
    #layout { display: flex; flex-direction: column; height: 100%; }

    /* Toolbar */
    #toolbar {
      flex-shrink: 0;
      padding: 10px 14px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    }
    #toolbar h1 { font-size: 14px; font-weight: 700; color: #58a6ff; margin-right: 4px; }
    button {
      padding: 5px 14px;
      border: 1px solid #30363d; border-radius: 6px;
      background: #21262d; color: #c9d1d9;
      font-size: 12px; cursor: pointer;
    }
    button:hover { background: #30363d; }
    button.active { background: #1f6feb; border-color: #388bfd; color: #fff; }

    /* Stats panel */
    #stats-panel {
      flex-shrink: 0;
      padding: 8px 14px;
      background: #111318;
      border-bottom: 1px solid #21262d;
      display: flex; flex-wrap: wrap; gap: 24px; align-items: center;
    }
    .stat { display: flex; flex-direction: column; }
    .stat-label { font-size: 10px; color: #8b949e; text-transform: uppercase; letter-spacing: 0.05em; }
    .stat-value { font-size: 20px; font-weight: 700; color: #f0f6fc; }
    .stat-value.good  { color: #2ea043; }
    .stat-value.warn  { color: #e3b341; }
    .stat-value.bad   { color: #f85149; }

    /* Chart */
    #chart-wrapper {
      flex-shrink: 0;
      padding: 8px 14px;
      background: #0d1117;
      border-bottom: 1px solid #21262d;
    }
    canvas { width: 100%; height: 80px; display: block; }

    /* Terminal */
    #terminal-container { flex: 1; overflow: hidden; padding: 4px; }
    #terminal-container .xterm { height: 100%; }
    #terminal-container .xterm-screen { height: 100% !important; }
  </style>
</head>
<body>
<div id="layout">
  <div id="toolbar">
    <h1>mobily / latency harness</h1>
    <button id="btn-start">&#9654; Start measurement</button>
    <button id="btn-stop">&#9646; Stop</button>
    <button id="btn-reset">&#10006; Reset</button>
    <span style="font-size:11px;color:#8b949e;margin-left:4px">
      Simulates the production WebView rAF loop.
      Send-echo RTT is measured by tagging input frames with a nonce and
      detecting the echo in output — same as the on-device latency instrumentation.
    </span>
  </div>

  <div id="stats-panel">
    <div class="stat">
      <span class="stat-label">Samples</span>
      <span class="stat-value" id="s-n">0</span>
    </div>
    <div class="stat">
      <span class="stat-label">P50</span>
      <span class="stat-value" id="s-p50">—</span>
    </div>
    <div class="stat">
      <span class="stat-label">P95</span>
      <span class="stat-value" id="s-p95">—</span>
    </div>
    <div class="stat">
      <span class="stat-label">Min</span>
      <span class="stat-value" id="s-min">—</span>
    </div>
    <div class="stat">
      <span class="stat-label">Max</span>
      <span class="stat-value" id="s-max">—</span>
    </div>
    <div class="stat" style="margin-left:auto">
      <span class="stat-label">Mode</span>
      <span class="stat-value" id="s-mode" style="font-size:13px;color:#8b949e">Stopped</span>
    </div>
  </div>

  <div id="chart-wrapper">
    <canvas id="chart"></canvas>
  </div>

  <div id="terminal-container"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
<script>
(function () {
  'use strict';

  // ── Stats ─────────────────────────────────────────────────────────────────
  var samples = [];
  var pendingTags = {};

  function updateStats() {
    var n = samples.length;
    document.getElementById('s-n').textContent = n;
    if (n === 0) {
      ['s-p50','s-p95','s-min','s-max'].forEach(function(id){
        document.getElementById(id).textContent = '—';
        document.getElementById(id).className = 'stat-value';
      });
      return;
    }
    var sorted = samples.slice().sort(function(a,b){return a-b;});
    var p50 = sorted[Math.floor(sorted.length * 0.50)];
    var p95 = sorted[Math.floor(sorted.length * 0.95)];
    var min = sorted[0];
    var max = sorted[sorted.length-1];

    function set(id, val) {
      var el = document.getElementById(id);
      el.textContent = Math.round(val) + 'ms';
      el.className = 'stat-value ' + (val < 50 ? 'good' : val < 150 ? 'warn' : 'bad');
    }
    set('s-p50', p50);
    set('s-p95', p95);
    set('s-min', min);
    set('s-max', max);

    drawChart(sorted, p50, p95);
  }

  // ── Chart ─────────────────────────────────────────────────────────────────
  var canvas = document.getElementById('chart');
  var ctx = canvas.getContext('2d');

  function drawChart(sorted, p50, p95) {
    var w = canvas.offsetWidth, h = 80;
    canvas.width = w * devicePixelRatio;
    canvas.height = h * devicePixelRatio;
    ctx.scale(devicePixelRatio, devicePixelRatio);

    ctx.clearRect(0, 0, w, h);

    if (sorted.length < 2) return;

    // Histogram with 20 buckets
    var min = sorted[0], max = sorted[sorted.length-1];
    var range = max - min || 1;
    var buckets = 20;
    var counts = new Array(buckets).fill(0);
    for (var i = 0; i < sorted.length; i++) {
      var b = Math.min(buckets-1, Math.floor((sorted[i]-min)/range*buckets));
      counts[b]++;
    }
    var maxCount = Math.max.apply(null, counts);

    var bw = w / buckets;
    for (var bi = 0; bi < buckets; bi++) {
      var bh = (counts[bi]/maxCount) * (h-10);
      var bx = bi * bw;
      var bval = min + (bi/buckets)*range;
      ctx.fillStyle = bval < p50 ? '#2ea043' : bval < p95 ? '#e3b341' : '#f85149';
      ctx.fillRect(bx+1, h-bh-5, bw-2, bh);
    }

    // P50 / P95 lines
    ctx.strokeStyle = '#58a6ff';
    ctx.lineWidth = 1;
    ctx.setLineDash([3,3]);
    var xp50 = ((p50-min)/range) * w;
    ctx.beginPath(); ctx.moveTo(xp50, 0); ctx.lineTo(xp50, h); ctx.stroke();
    ctx.strokeStyle = '#f85149';
    var xp95 = ((p95-min)/range) * w;
    ctx.beginPath(); ctx.moveTo(xp95, 0); ctx.lineTo(xp95, h); ctx.stroke();
    ctx.setLineDash([]);
  }

  // ── rAF batching (exact mirror of production WebView) ─────────────────────
  var outQ = [], rafPending = false;

  function enqueue(data) {
    outQ.push(data);
    if (!rafPending) {
      rafPending = true;
      requestAnimationFrame(function() {
        rafPending = false;
        if (!outQ.length) return;
        var chunk = outQ.join('');
        outQ = [];
        if (term) term.write(chunk);
      });
    }
  }

  // ── Terminal ──────────────────────────────────────────────────────────────
  var term = new Terminal({
    cursorBlink: true, fontSize: 13,
    fontFamily: "'Cascadia Code','JetBrains Mono','Fira Code','Courier New',monospace",
    theme: {
      background:'#0d1117', foreground:'#e6e6e6', cursor:'#e6e6e6',
      black:'#1a1a1a', red:'#da3633', green:'#2ea043', yellow:'#e3b341',
      blue:'#58a6ff', magenta:'#bc8cff', cyan:'#39c5cf', white:'#b1bac4',
      brightBlack:'#484f58', brightRed:'#f85149', brightGreen:'#56d364',
      brightYellow:'#e3b341', brightBlue:'#79c0ff', brightMagenta:'#d2a8ff',
      brightCyan:'#56d4dd', brightWhite:'#f0f6fc',
    },
    scrollback: 3000,
  });
  var fitAddon = new FitAddon.FitAddon();
  term.loadAddon(fitAddon);
  term.open(document.getElementById('terminal-container'));
  fitAddon.fit();
  new ResizeObserver(function(){fitAddon.fit();}).observe(document.getElementById('terminal-container'));

  // ── Measurement loop ──────────────────────────────────────────────────────
  var running = false, timer = null;
  var INTERVAL_MS = 32;  // ~30 keystrokes/sec to simulate active typing

  function makeTag() {
    return Math.random().toString(36).slice(2, 10).padEnd(8,'0').slice(0,8);
  }

  /**
   * In the production app, latency is measured as:
   *   sendTime = performance.now() when we write input to WS
   *   echoTime = performance.now() when we see the echo in output
   *
   * This harness simulates the same by:
   *   1. Writing an invisible DCS sequence as a "tagged" keystroke
   *   2. Immediately looping it back through the rAF queue (simulating
   *      the round-trip: phone → CLI → PTY → CLI → phone → WebView → xterm)
   *   3. Measuring the wall-clock delay induced by rAF coalescing
   *
   * In the real app the round-trip also includes:
   *   WS send → network → PTY → network → WS receive → rAF flush
   * The rAF component of latency is measured here; network is measured on-device.
   */
  function tick() {
    var tag = makeTag();
    var sendTime = performance.now();
    pendingTags[tag] = sendTime;

    // Simulate: send tagged frame → receive echo (via rAF)
    var echoData = '\x1bP' + tag + '\x1b\\';  // DCS escape (invisible to xterm)
    var visibleOutput = '\x1b[' + (30 + (Object.keys(pendingTags).length % 8)) + 'm' +
      new Date().toISOString().slice(11,23) + ' [rtt measuring]\x1b[0m\r\n';

    // The rAF batch: echo arrives in same JS frame → measures rAF coalescing overhead
    enqueue(visibleOutput + echoData);

    // Check for echo completions AFTER rAF fires
    requestAnimationFrame(function() {
      var echoTime = performance.now();
      if (pendingTags[tag] !== undefined) {
        var rtt = echoTime - pendingTags[tag];
        delete pendingTags[tag];
        samples.push(rtt);
        if (samples.length % 5 === 0) updateStats();
      }
    });
  }

  function startMeasurement() {
    if (running) return;
    running = true;
    document.getElementById('s-mode').textContent = 'Measuring…';
    document.getElementById('btn-start').classList.add('active');
    timer = setInterval(tick, INTERVAL_MS);
  }

  function stopMeasurement() {
    running = false;
    if (timer) { clearInterval(timer); timer = null; }
    document.getElementById('s-mode').textContent = 'Stopped';
    document.getElementById('btn-start').classList.remove('active');
    updateStats();
  }

  function resetMeasurement() {
    stopMeasurement();
    samples = [];
    pendingTags = {};
    updateStats();
    term.clear();
    term.writeln('\x1b[33mReset — ready for new measurement.\x1b[0m');
    document.getElementById('s-mode').textContent = 'Ready';
  }

  document.getElementById('btn-start').addEventListener('click', startMeasurement);
  document.getElementById('btn-stop').addEventListener('click', stopMeasurement);
  document.getElementById('btn-reset').addEventListener('click', resetMeasurement);

  // ── Welcome ───────────────────────────────────────────────────────────────
  term.writeln('\x1b[1;34mmobily\x1b[0m latency dev harness');
  term.writeln('Measures the rAF-batching component of keystroke-to-echo RTT.');
  term.writeln('');
  term.writeln('\x1b[33mNote:\x1b[0m This harness measures \x1b[1mlocal rAF coalescing latency only\x1b[0m.');
  term.writeln('On-device measurement includes network + PTY + rAF.');
  term.writeln('See \x1b[36m.scratch/latency-baseline.md\x1b[0m for end-to-end baseline notes.');
  term.writeln('');
  term.writeln('Click \x1b[32m▶ Start measurement\x1b[0m to begin.\r\n');
})();
</script>
</body>
</html>
