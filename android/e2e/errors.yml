# android/e2e/errors.yml
#
# Maestro flow: error states render correct messages.
#
# This flow tests the four error UX states:
#   1. Station offline    — "Station unreachable — is the CLI running?"
#   2. Auth rejection     — "Device not recognized — scan QR to re-pair"
#   3. Version mismatch   — "Please update"
#   4. Reconnecting state — overlay with attempt count
#
# Run with:
#   maestro test android/e2e/errors.yml
#
# Covers tasks.md:
#   - Error UX: auth rejection, station offline, version mismatch
#   - Connection state machine: reconnecting overlay
#   - Retry and Re-scan buttons visible in failed state

appId: io.github.kirank55.mobily
---
# ── Test 1: Station offline error ─────────────────────────────────────────────
# Launch with a pre-seeded pairing record pointing to an unreachable URL.
# The WsClient will fail to connect and eventually enter 'failed' state.
- launchApp:
    clearState: false
    # Env variable: MOBILY_TEST_TUNNEL_URL=ws://localhost:19999  (nothing listening)
    # In CI this is injected via test config; in manual runs set in the emulator env.

# The app loads the stored pairing and tries to connect. After 10 retries it fails.
# We simulate this by launching into the terminal screen with an unreachable URL.
# Maestro waits up to 30s for the error state to appear.
- runFlow:
    when:
      visible: "Connection lost"
    commands:
      - assertVisible:
          text: "Connection lost"
      - assertVisible:
          text: "Is the CLI running on your Station?"
      # Retry button should be visible for station-offline errors
      - assertVisible:
          text: "Retry"
          id: "retry-button"
        optional: true
      # Re-scan QR button should always be visible
      - assertVisible:
          text: "Re-scan QR"

# ── Test 2: Reconnecting overlay ──────────────────────────────────────────────
# While retrying, the reconnecting overlay should show attempt count.
- runFlow:
    when:
      visible: "Reconnecting"
    commands:
      - assertVisible:
          text: "Reconnecting"
      - assertVisible:
          text: "attempt"

# ── Test 3: Auth rejection error ──────────────────────────────────────────────
# This state is triggered when the CLI responds with close code 4001.
# In tests, this is simulated by clearing the device key from Keystore
# while keeping the pairing record. The CLI rejects the signature.
- runFlow:
    when:
      visible: "Device not recognized"
    commands:
      - assertVisible:
          text: "Device not recognized"
      - assertVisible:
          text: "Scan QR to re-pair your device"
      # Auth rejection should NOT show a Retry button (requires re-scan)
      - assertNotVisible:
          text: "Retry"
      # Re-scan QR should be the primary action
      - assertVisible:
          text: "Re-scan QR"

# ── Test 4: Version mismatch error ────────────────────────────────────────────
# Triggered when CLI responds with close code 4002 (version incompatible).
- runFlow:
    when:
      visible: "Please update"
    commands:
      - assertVisible:
          text: "Please update"
      - assertVisible:
          text: "Update the app or the CLI"

# ── Test 5: Re-scan QR navigates back to scanner ─────────────────────────────
- runFlow:
    when:
      visible: "Re-scan QR"
    commands:
      - tapOn: "Re-scan QR"
      # After tapping Re-scan, storage is cleared and we go to scanner
      - assertVisible:
          text: "Point at the QR code on your Station"

# ── Done ──────────────────────────────────────────────────────────────────────
- takeScreenshot: "error-states"
