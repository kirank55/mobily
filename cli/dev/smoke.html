<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mobily — smoke test</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css"
    />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        color: #e6e6e6;
        font:
          13px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          sans-serif;
      }
      #bar {
        display: flex;
        align-items: center;
        gap: 0.6em;
        padding: 0.4em 0.8em;
        background: #161616;
        border-bottom: 1px solid #2a2a2a;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      #dot {
        width: 0.7em;
        height: 0.7em;
        border-radius: 50%;
        background: #555;
        flex: none;
      }
      #dot.connecting {
        background: #d9a300;
      }
      #dot.connected {
        background: #2ea043;
      }
      #dot.disconnected {
        background: #da3633;
      }
      #status {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #term {
        position: absolute;
        top: 30px;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 4px;
      }
    </style>
  </head>
  <body>
    <div id="bar">
      <span id="dot"></span>
      <span id="status">mobily smoke test</span>
    </div>
    <div id="term"></div>

    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
    <script>
      'use strict';

      // ---------------------------------------------------------------------------
      // Read the port the CLI printed, e.g. open smoke.html?port=51234
      // ---------------------------------------------------------------------------
      const params = new URLSearchParams(location.search);
      const port = params.get('port');

      const statusEl = document.getElementById('status');
      const dotEl = document.getElementById('dot');
      const termEl = document.getElementById('term');

      function setState(state, text) {
        dotEl.className = state;
        statusEl.textContent = text;
      }

      if (!port) {
        setState('disconnected', 'open this page with ?port=PORT (see CLI)');
        throw new Error('missing ?port=');
      }

      // ---------------------------------------------------------------------------
      // Terminal
      // ---------------------------------------------------------------------------
      /** global Terminal — from xterm UMD bundle */
      const term = new Terminal({
        cursorBlink: true,
        fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace',
        fontSize: 13,
        theme: { background: '#000000' },
      });
      const fitAddon = new FitAddon.FitAddon();
      term.loadAddon(fitAddon);
      term.open(termEl);
      fitAddon.fit();
      term.focus();

      window.addEventListener('resize', () => fitAddon.fit());

      // ---------------------------------------------------------------------------
      // WebSocket
      // ---------------------------------------------------------------------------
      const url = `ws://localhost:${port}`;
      const ws = new WebSocket(url);

      function send(frame) {
        if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(frame));
      }

      function sendResize() {
        send({ type: 'resize', cols: term.cols, rows: term.rows });
      }

      ws.addEventListener('open', () => {
        setState('connected', `connected — ${url}`);
        fitAddon.fit();
        sendResize();
      });

      ws.addEventListener('message', (ev) => {
        let frame;
        try {
          frame = JSON.parse(ev.data);
        } catch {
          return;
        }
        if (frame && frame.type === 'output') term.write(frame.data);
      });

      ws.addEventListener('close', () => {
        setState('disconnected', 'disconnected — reload to reattach');
        term.write('\r\n\x1b[31m[disconnected]\x1b[0m\r\n');
      });

      ws.addEventListener('error', () => {
        setState('disconnected', `connection error — ${url}`);
      });

      // Keystrokes / paste → input frame.
      term.onData((data) => send({ type: 'input', data }));

      // Terminal resize (fit, window, etc.) → resize frame.
      term.onResize(() => sendResize());
    </script>
  </body>
</html>
